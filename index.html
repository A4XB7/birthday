<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday from Stunner 🎂</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#17002b,#4b0b67,#ff4f81);color:white;text-align:center;overflow-x:hidden}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.card{width:min(900px,100%);padding:38px 24px;border-radius:28px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);box-shadow:0 20px 70px rgba(0,0,0,.35)}h1{font-size:clamp(42px,8vw,78px);margin:0 0 10px}p{font-size:20px;line-height:1.5}button{border:0;border-radius:999px;padding:16px 28px;font-size:18px;font-weight:bold;cursor:pointer;background:white;color:#8a1455;box-shadow:0 8px 25px rgba(0,0,0,.25)}#surprise{display:none;margin-top:28px}video{display:block;width:100%;max-height:62vh;border-radius:20px;background:#000}.small{font-size:15px;opacity:.85}.balloon{position:fixed;bottom:-120px;font-size:54px;animation:float 9s linear infinite;pointer-events:none}.b1{left:8%}.b2{left:45%;animation-delay:2s}.b3{right:8%;animation-delay:4s}@keyframes float{to{transform:translateY(-115vh) rotate(15deg)}}.confetti{position:fixed;top:-20px;font-size:22px;animation:fall 3s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}</style></head><body><div class="balloon b1">🎈</div><div class="balloon b2">🎈</div><div class="balloon b3">🎈</div><main class="wrap"><section class="card"><div style="font-size:70px">🎂✨🎉</div><h1>Happy Birthday!</h1><p>Someone special has a surprise waiting for you…</p><button onclick="openSurprise()">🎁 Open Your Surprise</button><div id="surprise"><h2>🎉 Happy Birthday from Stunner! 🎉</h2><video id="birthdayVideo" controls playsinline preload="metadata"><source src="Prestige Birthday Countdown (10 to 0) ✨ High-End Gold & Diamond Masterpiece - sadakmiah30 (1080p, h264).mp4" type="video/mp4">Your browser cannot play this video.</video><p>💝 Wishing you happiness, laughter and beautiful memories!</p><p class="small">Created with ❤️ by Stunner</p></div></section></main><script>function openSurprise(){document.getElementById('surprise').style.display='block';document.querySelector('button').style.display='none';for(let i=0;i<90;i++){const c=document.createElement('div');c.className='confetti';c.textContent=['🎉','🎈','✨','💖','🎊'][Math.floor(Math.random()*5)];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}const v=document.getElementById('birthdayVideo');v.scrollIntoView({behavior:'smooth',block:'center'});v.load()}</script></body></html>
